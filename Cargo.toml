[workspace]
resolver = "3"
members = ["crates/*", "examples/gallery-rs/native"]
# `cargo run` runs the gallery (`crates/xtask/src/run.rs`).
default-members = ["crates/xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "deny"
private_interfaces = "deny"

[workspace.dependencies]
nsh-animation = { path = "crates/nsh-animation" }
nsh-core = { path = "crates/nsh-core" }
nsh-package = { path = "crates/nsh-package" }
nsh-ui-mobile = { path = "crates/nsh-ui-mobile" }
nsh-macros = { path = "crates/nsh-macros" }
nsh-js = { path = "crates/nsh-js" }
nsh-engine = { path = "crates/nsh-engine", default-features = false }
nsh-bundler = { path = "crates/nsh-bundler", default-features = false }
nsh-platform-ios = { path = "crates/nsh-platform-ios", default-features = false }
nsh-platform-android = { path = "crates/nsh-platform-android", default-features = false }
nsh-platform-linux = { path = "crates/nsh-platform-linux", default-features = false }
nsh-dev = { path = "crates/nsh-dev" }

anyhow = "1"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
crossbeam-channel = "0.5"
notify = "8.2"
log = "0.4"
libc = "0.2"
imagesize = "0.15"
ttf-parser = "0.25"
oxc_sourcemap = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.7"
zip = { version = "8", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
rustc-hash = "2.1"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "fast", "zeroize"] }
sha2 = "0.10"
flate2 = "1"
tar = { version = "0.4", default-features = false }
base64 = "0.22"
getrandom = "0.3"
slab = "0.4"
percent-encoding = "2.3"
url = "2.5"
ureq = "3.1"
jni = "0.21"
# The Linux backend (GTK 4.14+: Ubuntu 24.04, Debian 13, Fedora 40).
gtk4 = { version = "0.11", features = ["v4_14"] }
pango = "0.22"
pangocairo = "0.22"
taffy = { version = "0.15", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size"] }
# Features per crate: the runtime's binaries get only what they use.
tokio = { version = "1", default-features = false }

# `full` is avoided on purpose: it enables `dyn-load` (dlopen2), which does not build for iOS / Catalyst.
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }

rolldown = "=1.2.13"
rolldown_common = "=1.2.13"
oxc = { version = "=0.153.0", features = ["transformer", "codegen", "semantic", "ast_visit"] }

# Apple bindings: default features off. The defaults pull in every header
# and link frameworks we never use (CloudKit, CoreData, Metal, ...), which
# costs compile time and app launch time (dyld loads each linked framework).
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "NSArray",
  "NSAttributedString",
  "NSBundle",
  "NSCache",
  "NSData",
  "NSDictionary",
  "NSEnumerator",
  "NSError",
  "NSLocale",
  "NSNotification",
  "NSObject",
  "NSOperation",
  "NSRange",
  "NSRunLoop",
  "NSSet",
  "NSStream",
  "NSString",
  "NSURL",
  "NSURLRequest",
  "NSURLResponse",
  "NSURLSession",
  "NSValue",
] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "objc2-quartz-core",
  "NSAttributedString",
  "UIBarAppearance",
  "UIBehavioralStyle",
  "UIBarButtonItem",
  "UIBarItem",
  "UINavigationBar",
  "UINavigationBarAppearance",
  "UINavigationController",
  "UINavigationItem",
  "UIOrientation",
  "UIPresentationController",
  "UIViewControllerTransitionCoordinator",
  "UIAccessibility",
  "UIAccessibilityConstants",
  "UIAlertController",
  "UIPopoverPresentationController",
  "UIPopoverSupport",
  "UIAccessibilityCustomAction",
  "UIAccessibilityIdentification",
  "UIEvent",
  "UIGestureRecognizerSubclass",
  "UIPinchGestureRecognizer",
  "UIRotationGestureRecognizer",
  "UITouch",
  "NSLayoutAnchor",
  "NSLayoutConstraint",
  "NSText",
  "NSTextContainer",
  "UIActivityIndicatorView",
  "UIApplication",
  "UIColor",
  "UIControl",
  "UIDevice",
  "UIFont",
  "UIFontDescriptor",
  "UIGeometry",
  "UIGestureRecognizer",
  "UIGraphics",
  "UIImage",
  "UIInterface",
  "UILabel",
  "UILayoutGuide",
  "UILongPressGestureRecognizer",
  "UIMenuController",
  "UIPasteboard",
  "UIPanGestureRecognizer",
  "UIRefreshControl",
  "UIResponder",
  "UIScene",
  "UISceneConfiguration",
  "UISceneDefinitions",
  "UISceneOptions",
  "UISceneSession",
  "UIScreen",
  "UIScrollView",
  "UITapGestureRecognizer",
  "UITextField",
  "UITextInput",
  "UITextInputTraits",
  "UITextInteraction",
  "UITextView",
  "UITraitCollection",
  "UIView",
  "UIViewController",
  "UIWindow",
  "UIWindowScene",
  "UIBlurEffect",
  "UIHoverGestureRecognizer",
  "UIHoverStyle",
  "UIInteraction",
  "UIPointerInteraction",
  "UIPointerRegion",
  "UIPointerStyle",
  "UITargetedPreview",
  "UITimingCurveProvider",
  "UITimingParameters",
  "UIViewAnimating",
  "UIViewPropertyAnimator",
  "UIVisualEffect",
  "UIVisualEffectView",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFArray",
  "CFAttributedString",
  "CFCGTypes",
  "CFData",
  "CFDictionary",
  "CFNumber",
  "CFString",
  "CFURL",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
  "std",
  "CGBitmapContext",
  "CGColor",
  "CGColorSpace",
  "CGContext",
  "CGGradient",
  "CGImage",
  "CGPath",
] }
objc2-core-text = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-core-graphics",
  "CTFont",
  "CTFontDescriptor",
  "CTFontManager",
  "CTFontTraits",
  "CTFrame",
  "CTFramesetter",
  "CTLine",
  "CTParagraphStyle",
  "CTRun",
  "CTRunDelegate",
  "CTStringAttributes",
  "CTTypesetter",
] }
objc2-image-io = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-core-graphics",
  "CGImageProperties",
  "CGImageSource",
] }
block2 = "0.6.2"
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "CADisplayLink",
  "CALayer",
  "CATransform3D",
  "CAAnimation",
  "CAMediaTiming",
  "CAShapeLayer",
  "CATransaction",
  "CAGradientLayer",
  "CAMediaTimingFunction",
  "CABase",
] }
dispatch2 = "0.3.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Keep the interpreter and layout fast even in debug builds; they dominate runtime cost.
[profile.dev.package.rquickjs-sys]
opt-level = 3
[profile.dev.package.taffy]
opt-level = 3
