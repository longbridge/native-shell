[package]
name = "nsh-platform-web"
description = "WebAssembly backend: runs nsh apps in a browser, rendering to the DOM (the website's live demos)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The playground's build (`nsh-playground.wasm`): also compiles TSX in the
# page (`nsh_compile`; nsh's JSX compiler, no rolldown), about 3 MB more.
compiler = ["dep:nsh-bundler"]

[lib]
crate-type = ["cdylib", "rlib"]

# Empty off WebAssembly (like the other platform crates off their targets).
[target.'cfg(target_arch = "wasm32")'.dependencies]
nsh-core.workspace = true
nsh-animation.workspace = true
nsh-engine = { workspace = true, features = ["js"] }
nsh-ui-mobile.workspace = true
nsh-bundler = { workspace = true, optional = true }
serde_json.workspace = true
log.workspace = true
rustc-hash.workspace = true
ttf-parser.workspace = true
