[package]
name = "nsh-linux-host"
description = "Development host app (GTK 4) that runs a nsh bundle on Linux."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
log.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { workspace = true, features = ["dev"] }
nsh-dev.workspace = true
nsh-engine = { workspace = true, features = ["js"] }
