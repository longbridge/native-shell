[package]
name = "nsh-cli"
description = "The nsh command line tool: build, package and run apps."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "nsh"
path = "src/main.rs"

[dependencies]
nsh-bundler = { workspace = true, features = ["bundle"] }
nsh-core.workspace = true
nsh-engine = { workspace = true, features = ["js"] }
nsh-dev = { workspace = true, features = ["server"] }
nsh-js.workspace = true
nsh-ui-mobile.workspace = true
nsh-package.workspace = true
crossbeam-channel.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
notify.workspace = true
log.workspace = true
libc.workspace = true
ureq.workspace = true
serde.workspace = true
serde_json.workspace = true
plist.workspace = true
zip.workspace = true
flate2.workspace = true
tar.workspace = true
sha2.workspace = true
base64.workspace = true
image.workspace = true
