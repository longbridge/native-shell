name: GPUI

# Builds, lints and tests the GPUI backend on macOS, Windows and Linux, and
# the tooling that runs it (`nsh run --target gpui`, `nsh package --target
# gpui`).

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/gpui.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/gpui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpui-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Temporary directories (tests) outside the checkout.
      - name: Set up the environment
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"

      # QuickJS is C (bindgen needs libclang); GPUI links X11, Wayland,
      # xkbcommon, fontconfig and FreeType, and draws with Vulkan (GPUI
      # Fast's CI list; GTK 3 and WebKitGTK are for web views).
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang libclang-dev build-essential pkg-config \
            libasound2-dev libfontconfig-dev libfreetype-dev libssl-dev \
            libvulkan1 libwayland-dev libx11-xcb-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Set up Windows
        if: runner.os == 'Windows'
        run: |
          # QuickJS is C: bindgen needs libclang, which the image's LLVM has.
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
          # rustc can overflow its default stack on the `windows` crate.
          echo "RUST_MIN_STACK=268435456" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-gpui-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-gpui-cargo-

      - name: Clippy
        run: >
          cargo clippy --all-targets
          -p nsh-platform-gpui -p nsh-gpui-host -p nsh-gpui-app
          -p nsh-cli -p nsh-dev
          --features nsh-platform-gpui/dev
          -- -D warnings

      # Tests need no display: they open no window.
      - name: Test
        run: cargo test -p nsh-platform-gpui -p nsh-gpui-host -p nsh-gpui-app -p nsh-cli -p nsh-dev
