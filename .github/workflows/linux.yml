name: Linux

# Builds, lints and tests the Linux backend (GTK 4) and the tooling that runs
# it (`nsh run --target linux`, `nsh package --target linux`).

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/linux.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/linux.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # 24.04 has GTK 4.14 and Pango 1.52+, what `nsh-platform-linux` needs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # QuickJS is C (bindgen needs libclang); the backend links GTK 4 and
      # Pango.
      - name: Install clang and GTK 4
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev libgtk-4-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-linux-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-linux-cargo-

      - name: Clippy
        run: >
          cargo clippy --all-targets
          -p nsh-platform-linux -p nsh-linux-host -p nsh-linux-app
          -p nsh-cli -p nsh-dev -p xtask
          -- -D warnings

      # Tests need no display: they do not start GTK.
      - name: Test
        run: cargo test -p nsh-platform-linux -p nsh-cli -p nsh-dev
